name: Package Addon Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Universal Zip
        run: |
          # Create a clean release folder structure
          mkdir -p release_build/Ding_Level_Up
          
          # Copy all necessary add-on files directly from the root
          cp Core.lua *.toc icon.tga README.md release_build/Ding_Level_Up/ 2>/dev/null || true
          
          cd release_build
          zip -r ../Ding_Level_Up.zip Ding_Level_Up
          cd ..

      - name: Upload Zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Ding_Level_Up.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}