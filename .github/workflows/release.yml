name: Package Addon Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package TBC Addon Zip
        run: |
          mkdir -p build_tbc/Ding_Level_Up
          cp tbc/Ding_Level_Up/* build_tbc/Ding_Level_Up/ 2>/dev/null || true
          cd build_tbc
          zip -r ../Ding_Level_Up_TBC.zip Ding_Level_Up
          cd ..

      - name: Package Forever Addon Zip
        run: |
          mkdir -p build_forever/Ding_Level_Up
          cp forever/Ding_Level_Up/* build_forever/Ding_Level_Up/ 2>/dev/null || true
          cd build_forever
          zip -r ../Ding_Level_Up_Forever.zip Ding_Level_Up
          cd ..

      - name: Upload Zips to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Ding_Level_Up_TBC.zip
            Ding_Level_Up_Forever.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}